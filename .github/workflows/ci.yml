name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python: ["3.8", "3.10", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # The tests import the Tk UI modules (no window is created), so Tkinter must be present.
      - name: Check Tkinter
        shell: bash
        run: |
          if ! python -c "import tkinter; tkinter.Tcl()"; then
            if [ "$RUNNER_OS" != "Linux" ]; then exit 1; fi
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends tk8.6
            python -c "import tkinter; tkinter.Tcl()"
          fi
          python -c "import sys, sqlite3, tkinter; print(sys.version); print('SQLite', sqlite3.sqlite_version, '/ Tk', tkinter.TkVersion)"

      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -t . -v

      - name: Self-test
        run: python sqlite_gui_analyzer.py --self-test

      # Drives every tab of the real Tk window over the test fixtures.
      - name: UI smoke test
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python tools/ui_smoke.py
